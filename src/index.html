  <script>
    (function () {
      try {
        var stored = localStorage.getItem('ohm-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { /* private mode, etc. — fall back to prefers-color-scheme */ }
    })();
  </script>

</script>
